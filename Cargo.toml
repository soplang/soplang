[package]
name = "soplang"
version = "3.1.0"
edition = "2021"

[dependencies]
clap = { version = "4", features = ["derive"] }
colored = "2"
cranelift = "0.125"
cranelift-frontend = "0.125"
cranelift-jit = "0.125"
cranelift-module = "0.125"
cranelift-native = "0.125"
rustyline = "14"
thiserror = "1.0"
unicode-width = "0.1.14"
unicode-segmentation = "1.13.3"
regex = "1.13.1"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "soplang_bench"
harness = false
