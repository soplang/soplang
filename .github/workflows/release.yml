name: Soplang Release Automation

on:
  push:
    branches:
      - "release/v*"
  release:
    types: [published]

# Add explicit permissions for the GITHUB_TOKEN
permissions:
  contents: write

jobs:
  verify:
    if: github.event_name == 'push'
    permissions:
      contents: read
    uses: ./.github/workflows/release-verification.yml

  draft-release:
    name: Draft verified release
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate release version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#release/v}"
          CARGO_VERSION=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)
          [[ "$VERSION" == "$CARGO_VERSION" && "$VERSION" == 3.* ]]
          NOTES="docs/releases/$VERSION.md"
          if [[ "$VERSION" == "3.0.0" ]]; then
            NOTES="docs/RELEASE_NOTES_V3.md"
          fi
          [[ -f "$NOTES" ]] || { echo "Missing release notes: $NOTES" >&2; exit 1; }
          echo "RELEASE_NOTES=$NOTES" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$VERSION" >> "$GITHUB_ENV"
          if [[ "$VERSION" == *-* ]]; then
            echo "PRERELEASE=true" >> "$GITHUB_ENV"
          else
            echo "PRERELEASE=false" >> "$GITHUB_ENV"
          fi
      - uses: actions/download-artifact@v4
        with:
          pattern: soplang-*
          merge-multiple: true
          path: release-assets
      - name: Verify assets and combine checksums
        run: python3 scripts/release_assets.py release-assets
      - name: Create draft with verified package assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: Soplang ${{ env.RELEASE_TAG }}
          body_path: ${{ env.RELEASE_NOTES }}
          files: |
            release-assets/**/*.tar.gz
            release-assets/**/*.deb
            release-assets/**/*.zip
            release-assets/**/*.exe
            release-assets/**/*.dmg
            release-assets/SHA256SUMS
          fail_on_unmatched_files: false
          draft: true
          prerelease: ${{ env.PRERELEASE == 'true' }}

  publish-aur:
    name: Publish to AUR when configured
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published' && !github.event.release.prerelease

    steps:
      - name: Check AUR credentials
        id: aur
        env:
          AUR_USERNAME: ${{ secrets.AUR_USERNAME }}
          AUR_EMAIL: ${{ secrets.AUR_EMAIL }}
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [[ -n "$AUR_USERNAME" && -n "$AUR_EMAIL" && -n "$AUR_SSH_PRIVATE_KEY" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::AUR credentials are not configured; skipping optional AUR publication."
          fi
      - name: Checkout code
        if: steps.aur.outputs.enabled == 'true'
        uses: actions/checkout@v7

      - name: Extract version
        if: steps.aur.outputs.enabled == 'true'
        id: extract_version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION_NUM="${RELEASE_TAG#v}"
          echo "VERSION_NUM=$VERSION_NUM" >> "$GITHUB_ENV"

      - name: Generate PKGBUILD
        if: steps.aur.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p aur-workspace
          cp linux/aur/PKGBUILD.template aur-workspace/PKGBUILD
          
          # Use the same verified Linux archive attached to this release.
          gh release download "${{ github.event.release.tag_name }}" \
            -p "soplang-${VERSION_NUM}-linux-x86_64.tar.gz" \
            -D aur-workspace
          SHA256=$(sha256sum "aur-workspace/soplang-${VERSION_NUM}-linux-x86_64.tar.gz" | awk '{print $1}')
          
          # Replace placeholders
          sed -i "s/{{VERSION}}/${VERSION_NUM}/g" aur-workspace/PKGBUILD
          sed -i "s/{{SHA256}}/${SHA256}/g" aur-workspace/PKGBUILD

      - name: Generate .SRCINFO
        if: steps.aur.outputs.enabled == 'true'
        run: |
          # Use an Arch Linux container to run makepkg
          docker run --rm -v "$PWD/aur-workspace:/pkg" -w /pkg archlinux:latest bash -c "pacman -Sy --noconfirm base-devel sudo && useradd -m builduser && chown -R builduser:builduser /pkg && sudo -u builduser makepkg --printsrcinfo > .SRCINFO"

      - name: Publish to AUR
        if: steps.aur.outputs.enabled == 'true'
        uses: KSXGitHub/github-actions-deploy-aur@v2.7.2
        with:
          pkgname: soplang
          pkgbuild: ./aur-workspace/PKGBUILD
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to ${{ github.event.release.tag_name }}"
          ssh_keyscan_types: rsa,ecdsa,ed25519
