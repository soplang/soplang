name: Verify release packages

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'examples/**'
      - 'scripts/**'
      - 'linux/**'
      - 'macos/**'
      - 'windows/**'
      - 'Cargo.*'
      - 'rust-toolchain.toml'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/*.yml'
      - 'docs/INSTALLING_PACKAGES.md'
      - 'README.md'

permissions:
  contents: read

jobs:
  native-linux:
    name: Toolchain-free Linux package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@1.94.0
      - name: Install LLVM and LLD build libraries
        run: sudo apt-get update && sudo apt-get install -y llvm-18-dev liblld-18-dev patchelf
      - name: Build and verify native package
        env:
          SOPLANG_LLD_SDK: /usr/lib/llvm-18
        run: |
          export PATH="/usr/lib/llvm-18/bin:$PATH"
          python3 scripts/package_native.py --output target/native-package
          python3 scripts/verify_package.py target/native-package/soplang

  native-macos:
    name: Toolchain-free macOS package
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@1.94.0
      - name: Install LLVM and LLD build libraries
        run: brew install llvm@22 lld@22
      - name: Build and verify native package
        run: |
          python3 scripts/package_native_macos.py --output target/native-package
          SOPLANG_ERROR_DETAILS=1 target/native-package/soplang --no-color --build examples/01_hello.sop -o target/native-smoke
          python3 scripts/verify_package.py target/native-package/soplang

  native-windows:
    name: Toolchain-free Windows package
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Install LLVM SDK and archive extractor
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh release download llvmorg-23.1.4 -R llvm/llvm-project -p 'clang+llvm-23.1.4-x86_64-pc-windows-msvc.tar.zst' --dir target/llvm-download
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          choco install zstandard --no-progress -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $archive = (Get-ChildItem target/llvm-download -Filter '*.zst' | Select-Object -First 1).FullName
          zstd --long=30 -d $archive -o target/llvm-sdk.tar
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force target/llvm-sdk | Out-Null
          tar -xf target/llvm-sdk.tar -C target/llvm-sdk
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sdk = (Get-ChildItem target/llvm-sdk -Directory | Select-Object -First 1).FullName
          "SOPLANG_LLVM_SDK=$sdk" >> $env:GITHUB_ENV
      - name: Build and verify native package
        shell: pwsh
        run: |
          python scripts/package_native_windows.py --output target/native-package
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:SOPLANG_ERROR_DETAILS = '1'
          & target/native-package/soplang.exe --no-color --build examples/01_hello.sop -o target/native-smoke.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item Env:SOPLANG_ERROR_DETAILS
          python scripts/verify_package.py target/native-package/soplang.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  native:
    name: Native package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@1.94.0
      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang dpkg-dev llvm-18-dev liblld-18-dev patchelf
      - name: Show toolchain
        run: |
          rustc -vV
          clang --version
      - name: Test compiler
        run: cargo test --locked
      - name: Test optimized compiler
        run: cargo test --release --locked
      - name: Build Linux archive and Debian package
        if: runner.os == 'Linux'
        env:
          SOPLANG_LLD_SDK: /usr/lib/llvm-18
        run: |
          export PATH="/usr/lib/llvm-18/bin:$PATH"
          bash linux/build_linux.sh
      - name: Verify extracted Linux packages
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/archive-install target/deb-install
          tar -xzf linux/soplang-*-linux-*.tar.gz -C target/archive-install
          dpkg-deb -x linux/soplang_*.deb target/deb-install
          python3 scripts/verify_package.py target/archive-install/soplang/soplang
          python3 scripts/verify_package.py target/deb-install/usr/bin/soplang
          (cd linux && sha256sum -c SHA256SUMS)
          python3 scripts/verify_installation.py debian linux/soplang_*.deb
      - name: Build and verify Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./windows/build_windows.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Expand-Archive windows/soplang-*-windows-*.zip target/archive-install
          python scripts/verify_package.py target/archive-install/soplang/soplang.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installer = "windows/Output/soplang-setup.exe"
          if (Test-Path $installer) {
            python scripts/verify_installation.py windows $installer
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          foreach ($row in Get-Content windows/SHA256SUMS) {
            $hash, $name = $row -split '  ', 2
            $found = (Get-ChildItem windows -Recurse -File | Where-Object Name -eq $name)
            if (@($found).Count -ne 1 -or (Get-FileHash $found.FullName -Algorithm SHA256).Hash.ToLower() -ne $hash) {
              throw "Checksum failed: $name"
            }
          }
      - name: Build and verify macOS archive
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          bash macos/build_macos.sh
          mkdir -p target/archive-install
          tar -xzf macos/soplang-*-macos-*.tar.gz -C target/archive-install
          python3 scripts/verify_package.py target/archive-install/Soplang.app/Contents/MacOS/soplang
          (cd macos && shasum -a 256 -c SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: soplang-${{ matrix.os }}
          path: |
            linux/*.tar.gz
            linux/*.deb
            linux/SHA256SUMS
            macos/*.tar.gz
            macos/*.dmg
            macos/SHA256SUMS
            windows/*.zip
            windows/Output/*.exe
            windows/SHA256SUMS
          if-no-files-found: error

  container:
    name: Container package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build release image
        run: docker build -t soplang:release-check .
      - name: Verify installed container package
        run: |
          docker run --rm --entrypoint python3 \
            -v "$PWD/scripts:/verify/scripts:ro" \
            -v "$PWD/examples:/verify/examples:ro" \
            soplang:release-check /verify/scripts/verify_package.py /usr/local/bin/soplang
